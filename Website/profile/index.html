<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE FOUNDER | WANDERLUST</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #100b10; }
    body { display: flex; justify-content: center; align-items: flex-start; }
    .profile-page {
      position: relative;
      width: min(100%, 1024px);
      line-height: 0;
      background: #100b10;
    }
    .profile-page img { display: block; width: 100%; height: auto; }
    .home-link {
      position: absolute;
      left: 22%;
      top: 94.5%;
      width: 56%;
      height: 4.3%;
      display: block;
      line-height: normal;
      text-indent: -9999px;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
    }
    .home-link:focus-visible {
      outline: 2px solid #e7d9df;
      outline-offset: 3px;
      background: #ffffff18;
    }
  </style>
</head>
<body>
  <main class="profile-page">
    <img src="images/founder-profile.png"
         alt="WANDERLUST創始者・黒薔薇青葉のプロフィール">
    <a class="home-link" href="../index.html" aria-label="BACK TO HOME">BACK TO HOME</a>
  </main>
</body>
</html>
