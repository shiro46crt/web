.question {

}

  color: #51483f;

  font-size: 13px;

input:focus, textarea:focus, select:focus {

}

textarea {

}

button {

  padding: 18px;
  background: #b98f89;

function diagnose() {
  const mood = document.getElementById("mood").value;
  const genre = document.getElementById("genre").value;
  const favorite = document.getElementById("favorite").value;
  const detail = document.getElementById("detail").value;

  // 気分とジャンルの一致度を計算
  let matches = animeList.map(anime => {
    let score = 0;

    if (anime.mood === mood) {
      score += 2;
    }

    if (genre === "なんでも" || anime.genre === genre) {
      score += 2;
    }

    return {
      ...anime,
      score: score
    };
  });

  // 最もスコアの高い作品を抽出
  const maxScore = Math.max(...matches.map(a => a.score));

  matches = matches.filter(a => a.score === maxScore);

  // 同点の作品からランダムに選択
  const result = matches[
    Math.floor(Math.random() * matches.length)
  ];

  document.getElementById("resultContent").innerHTML = `
    <p class="anime-name">${escapeHTML(result.name)}</p>
    <p>${escapeHTML(result.description)}</p>
    <p>♡ ${escapeHTML(result.point)}</p>

    <p style="color:#ad9187;font-size:11px">
      YOUR MOOD : ${escapeHTML(mood)} / ${escapeHTML(genre)}
    </p>

    <p style="font-size:11px;color:#a69a8d">
      ${favorite ? "好きな作品：" + escapeHTML(favorite) : ""}
    </p>
  `;

  document.getElementById("result").style.display = "block";

  document.getElementById("result").scrollIntoView({
    behavior: "smooth"
  });
}



function escapeHTML(str) {
  return str.replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}
